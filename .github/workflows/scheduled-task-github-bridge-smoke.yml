name: Scheduled Task GitHub Bridge Smoke

on:
  workflow_dispatch:

jobs:
  github-bridge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call staging smoke bridge
        run: |
          set -euo pipefail

          curl --fail-with-body \
            "https://kukyotcgbnchsoeriqoz.supabase.co/functions/v1/personews-github-smoke?run_id=${GITHUB_RUN_ID}"

          echo
          echo "GitHub -> staging bridge smoke succeeded."
