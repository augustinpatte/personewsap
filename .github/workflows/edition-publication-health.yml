name: PersoNewsAP Edition Publication Health

# Did tonight's edition publish, verify and reach readers?
#
# The scheduled publisher (Supabase pg_cron in staging) targets 19:00
# Europe/Paris and retries every 15 minutes until 21:00. This job runs once the
# window has closed and asks about ONE date — the Paris edition owed today,
# never "the latest published edition", which is how a night with no edition
# used to stay green — and it asks both projects:
#
#   production  is there an editions row for that exact date, and were readers
#               released and told (or are deliveries still within their retries)?
#   staging     did the scheduled publisher verify it and write the receipt?
#
# A production row alone is NOT a healthy edition: content can be written and
# never verified (no questions, no assignments, no release). Exit 1 when the
# edition is missed, unverified, failed verification, or verified but not
# released / never attempted. Staging must be readable (--require-staging).
# Diagnosis and recovery are printed in the failure detail:
#   staging: select public.edition_publication_timeline('<date>');
#   staging: select public.run_scheduled_publication_tick(true);
#
# No continue-on-error: a failed check has to be visible.

on:
  schedule:
    - cron: "20 21 * * 1,3,5,0"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date to check (YYYY-MM-DD). Empty = the edition due today in Europe/Paris."
        required: false
        default: ""

jobs:
  edition-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      # The engine refuses to write unless the target is declared (storage/projectRef.ts).
      EXPECTED_SUPABASE_REF: wkbviidrbmehmjbhvpeh
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Read-only use: scheduled_edition_publication_health(date) in staging.
      # The same secrets the edition follow-up workflow already uses.
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build content engine
        run: npm run content:build

      # Non-strict on purpose: it fails on what needs a human (missed,
      # unverified, verification failed, release failed, devices never
      # attempted), not on deliveries still within their retries.
      - name: Did today's edition publish, verify, and reach readers?
        env:
          EDITION_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$EDITION_DATE" ]; then
            npm run content:notification-health -- --require-staging --date "$EDITION_DATE"
          else
            npm run content:notification-health -- --require-staging
          fi
