name: PersoNewsAP Push Notification Delivery

# THE PRIMARY TRIGGER IS THE EVENT, NOT THE CLOCK.
#
# `repository_dispatch: edition_published` is sent by production's own
# `public.dispatch_notification_events` within a couple of minutes of an edition
# being published, from a row written in the publishing transaction itself. That
# is what normally sends the notifications.
#
# The schedules below are RECOVERY ONLY. They exist for the night the dispatcher
# cannot reach GitHub, its Vault secrets are missing, or an Expo outage left
# devices to retry. They are safe to run at any time and safe to run when the
# event path already did the work: a delivery already sent, awaiting a receipt
# or terminal is skipped, so a schedule that finds nothing to do sends nothing.
# This is never a second reminder.
#
# No continue-on-error anywhere in this file. A failed send has to be visible.

on:
  repository_dispatch:
    types: [edition_published]
  schedule:
    - cron: "15 19 * * 1,3,5,0"
      timezone: "Europe/Paris"
    - cron: "30 19 * * 1,3,5,0"
      timezone: "Europe/Paris"
    - cron: "0 20 * * 1,3,5,0"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated languages"
        required: false
        default: "fr,en"

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANGUAGES: ${{ github.event.inputs.languages || 'fr,en' }}
      DRY_RUN: "false"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: What triggered this run
        run: |
          echo "trigger: ${{ github.event_name }}"
          echo "edition: ${{ github.event.client_payload.edition_date || 'from the cadence' }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build content engine
        run: npm run content:build

      # No --date, on purpose, even on a repository_dispatch that names one.
      # The command drains the outbox and announces every edition the events
      # name, plus today's cadence date. An explicit --date would suppress the
      # outbox drain and turn the event path back into a date guess.
      - name: Deliver edition notifications
        run: npm run content:push-notifications

      - name: Notification health
        if: always()
        run: npm run content:notification-health
