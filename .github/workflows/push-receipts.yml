name: PersoNewsAP Push Receipt Reconciliation

# Expo push tickets are accepted before APNs/FCM delivery is final. This job
# runs after the edition notification window and reconciles receipts without
# delaying or blocking publication.
#
# The edition job starts at 19:00 Europe/Paris. Receipt checks run repeatedly
# while Expo receipts are fresh and then stop naturally once rows are sent or
# terminal.

on:
  schedule:
    - cron: "35 19 * * 1,3,5,0"
      timezone: "Europe/Paris"
    - cron: "35 20 * * 1,3,5,0"
      timezone: "Europe/Paris"
    - cron: "35 21 * * 1,3,5,0"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum awaiting receipts to check"
        required: false
        default: "1000"

jobs:
  push-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: "false"
      PUSH_RECEIPT_LIMIT: ${{ github.event.inputs.limit || '1000' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build content engine
        run: npm run content:build

      - name: Reconcile Expo push receipts
        run: npm run content:push-receipts
