name: Learning Path CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

jobs:
  learning-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm run learning:catalog:build
      - run: git diff --exit-code -- content/learning-paths/v1
      - run: npm run learning:catalog:validate
      - run: npm run learning:catalog:report
      - run: npm run learning:proof
      - run: npm run content:build
      - run: npm run test
      - run: npm run mobile:typecheck
      - run: npm run mobile:doctor
      - run: npm run supabase:doctor
      - run: git diff --check
