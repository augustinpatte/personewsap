name: PersoNewsAP Content Daily Job

# PersoNewsAP publishes four editions a week: Monday, Wednesday, Friday and
# Sunday at 19:00 Europe/Paris. The editorial date is still resolved by the
# content engine itself, so this schedule decides when the run starts, never
# which date it builds.
#
# IMPORTANT: a scheduled workflow only becomes active once this file exists on
# the repository's DEFAULT BRANCH (main). While it lives on a feature branch it
# can be started manually with "Run workflow", but it will never fire on its own.

on:
  schedule:
    # 19:00 Europe/Paris on Monday, Wednesday, Friday and Sunday.
    - cron: "0 19 * * 1,3,5,0"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated languages"
        required: false
        default: "fr,en"
      run_id:
        description: "Optional stable run id"
        required: false
        default: ""

jobs:
  daily-job:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LANGUAGES: ${{ github.event.inputs.languages || 'fr,en' }}
      CONTENT_STATUS: published
      LEARNING_GENERATION_MODE: deterministic
      # Production project: where the edition is published and read from.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # ChatGPT staging project: where the approved edition is read from. Read
      # only, apart from the publication receipt written after production
      # succeeds. Deliberately a separate credential pair — a job pointed at the
      # wrong project must fail loudly, not silently find no editions.
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      # No OPENAI_API_KEY, no ANTHROPIC_API_KEY, and no USE_LLM. Editorial
      # generation happens in ChatGPT Scheduled Tasks before this workflow runs,
      # and there is deliberately no automatic fallback to a paid API: an
      # unreviewed edition is worse than no edition.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build content engine
        run: npm run content:build

      - name: Deterministic preflight
        run: npm run content:dry-run -- --languages "$LANGUAGES" --topics business,finance,tech_ai,law,medicine,engineering,sport_business,culture_media

      - name: Supabase schema doctor
        run: npm run supabase:doctor

      # Reads the approved staging batch, revalidates every item through the
      # same validators the LLM path used, persists through ContentRepository,
      # assigns the daily drops, then records the receipt in staging.
      #
      # A clean no-op when no READY batch exists: the command refuses and the
      # step is allowed to fail without taking the rest of the workflow down.
      - name: Publish approved staging edition
        id: publish
        continue-on-error: true
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: npm run content:staging-publish -- --languages "$LANGUAGES"

      - name: Report missing edition
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning title=No edition published::No approved ChatGPT batch was ready for today. Nothing was written. Check the staging review queue, then re-run this workflow."

      # Announcing the edition is a separate, re-runnable step on purpose: the
      # edition is already published by the step above, and a push failure must
      # never undo or block it. Deliveries are recorded per device and per
      # edition, so re-running this sends nothing twice.
      - name: Edition push notifications
        id: push_notifications
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        run: npm run content:push-notifications

      - name: Report notification failure
        if: steps.push_notifications.outcome == 'failure'
        run: |
          echo "::warning title=Edition notifications::The edition is published, but notifications did not all go out. Re-run 'npm run content:push-notifications -- --date <YYYY-MM-DD>'; already-notified devices are skipped."

      - name: Strict job health
        if: always()
        run: npm run content:job-health:strict -- --limit 5
