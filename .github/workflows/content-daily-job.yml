name: PersoNewsAP Edition Follow-up

# Publication no longer happens here.
#
# PersoNews editions are published by Supabase itself: pg_cron in the staging
# project fires `personews-scheduled-publisher` at 19:00 Europe/Paris on Monday,
# Wednesday, Friday and Sunday, a deterministic SQL hard gate decides whether the
# batch is genuinely complete, and production's own
# `publish_scheduled_staging_payload` writes the edition in one transaction. No
# model, no agent and no CI runner takes part in that decision.
#
# What is left for CI is everything that comes AFTER an edition exists: the push
# notifications and the health checks. It runs at 19:10 Europe/Paris — ten
# minutes behind the publisher — so that when it looks for tonight's edition,
# the edition is already there.
#
# THIS IS NO LONGER THE PRIMARY NOTIFICATION TRIGGER. Publishing an edition now
# writes a row in `public.notification_outbox` inside the publishing transaction,
# and `public.dispatch_notification_events` wakes the sender within a couple of
# minutes of the edition actually existing. A clock ten minutes ahead of an
# unknown duration was always a guess: too early and the readers are told
# nothing, too late and they are told late, and neither shows up as a failure.
# This run stays as a safety net for the case where the event path is down.
#
# The old `content:staging-publish` step has been removed rather than disabled.
# The command still exists as a manual break-glass tool (it refuses a batch that
# already carries a publication receipt), but nothing runs it on a schedule any
# more: two publishers writing the same edition through two different dedup keys
# is exactly the duplicate this repository must not be able to produce.
#
# IMPORTANT: a scheduled workflow only becomes active once this file exists on
# the repository's DEFAULT BRANCH (main).

on:
  schedule:
    # 19:10 Europe/Paris on Monday, Wednesday, Friday and Sunday — ten minutes
    # after the Supabase publisher. GitHub resolves this timezone itself, so CET
    # and CEST are both handled.
    - cron: "10 19 * * 1,3,5,0"
      timezone: "Europe/Paris"
  workflow_dispatch:

jobs:
  edition-follow-up:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANGUAGES: "fr,en"
      LEARNING_GENERATION_MODE: deterministic
      # Production project: where the edition was published and is read from.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # ChatGPT staging project: read only, for health reporting.
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      # No OPENAI_API_KEY, no ANTHROPIC_API_KEY, no USE_LLM. Nothing in this
      # workflow generates, reviews or publishes editorial content.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build content engine
        run: npm run content:build

      - name: Supabase schema doctor
        run: npm run supabase:doctor

      # Deliveries are recorded per device and per edition, so this is safe to
      # re-run and sends nothing twice. If no edition was published tonight there
      # is nothing to announce and the step finds nothing to do.
      # NOT continue-on-error. A notification step that fails silently is how
      # this product went months without delivering a single edition
      # notification while every workflow run stayed green.
      - name: Edition push notifications
        run: npm run content:push-notifications

      # The gate. `job-health --strict` used to run here; it reads
      # `content_job_runs`, which nothing has written since publication moved
      # into Supabase, so it was reporting on a pipeline that no longer exists
      # and knew nothing about notifications. This asks the only question that
      # matters after an edition publishes: does every eligible device have a
      # delivery row? `if: always()` so it still runs — and still fails — when
      # the send step above failed.
      - name: Notification health
        if: always()
        run: npm run content:notification-health:strict
